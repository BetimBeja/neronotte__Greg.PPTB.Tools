<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Theme Studio — logo (Sunset)</title>

  <defs>
    <linearGradient id="gradRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#E64545"/>
    </linearGradient>
    <linearGradient id="gradYellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#FFA94D"/>
      <stop offset="100%" stop-color="#F2830D"/>
    </linearGradient>
    <linearGradient id="gradPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#CC5DE8"/>
      <stop offset="100%" stop-color="#A736C9"/>
    </linearGradient>
    <linearGradient id="gradBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#4DABF7"/>
      <stop offset="100%" stop-color="#1E88E5"/>
    </linearGradient>
  </defs>

  <!-- <rect x="0" y="0" width="400" height="400" fill="#FFFFFF"/> -->

  <!--
    Tutte le ombre sono ora disegnate PER PRIME, prima di qualsiasi
    quadrato: cosi' nessuna ombra puo' mai apparire sopra un quadrato
    (l'ordine nel documento SVG e' anche l'ordine di sovrapposizione).
    Poi vengono disegnati i 4 quadrati, con il Viola per ultimo cosi'
    da avere sempre lo z-index piu' alto quando si solleva.

    Timeline (ciclo unico condiviso, dur=2.5s, salita=discesa=0.5s
    ciascuna, nessuna sovrapposizione tra un ciclo e il successivo):
      Blu:     sale 0-0.5s     scende 0.5-1.0s
      Rosso:   sale 0.5-1.0s   scende 1.0-1.5s
      Arancio: sale 1.0-1.5s   scende 1.5-2.0s
      Viola:   sale 1.5-2.0s   scende 2.0-2.5s
  -->

  <!-- Ombra BLU -->
  <ellipse cx="98" cy="255" rx="52" ry="12" fill="#000000" opacity="0.24">
    <animate attributeName="rx" values="52;35;52;52" keyTimes="0;0.2;0.4;1"
             dur="2.5s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.24;0.09;0.24;0.24" keyTimes="0;0.2;0.4;1"
             dur="2.5s" begin="0s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Ombra ROSSO -->
  <ellipse cx="200" cy="198" rx="50" ry="11" fill="#000000" opacity="0.22">
    <animate attributeName="rx" values="50;50;33;50;50" keyTimes="0;0.2;0.4;0.6;1"
             dur="2.5s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.22;0.22;0.08;0.22;0.22" keyTimes="0;0.2;0.4;0.6;1"
             dur="2.5s" begin="0s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Ombra ARANCIO -->
  <ellipse cx="302" cy="255" rx="50" ry="11" fill="#000000" opacity="0.22">
    <animate attributeName="rx" values="50;50;33;50;50" keyTimes="0;0.4;0.6;0.8;1"
             dur="2.5s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.22;0.22;0.08;0.22;0.22" keyTimes="0;0.4;0.6;0.8;1"
             dur="2.5s" begin="0s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Ombra VIOLA -->
  <ellipse cx="200" cy="312" rx="50" ry="11" fill="#000000" opacity="0.22">
    <animate attributeName="rx" values="50;50;33;50" keyTimes="0;0.6;0.8;1"
             dur="2.5s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.22;0.22;0.08;0.22" keyTimes="0;0.6;0.8;1"
             dur="2.5s" begin="0s" repeatCount="indefinite"/>
  </ellipse>

  <!-- BLU (a sinistra) -->
  <rect x="-63.65" y="-63.65" width="127.3" height="127.3"
        fill="url(#gradBlue)" stroke="#1E88E5" stroke-width="1.5" stroke-linejoin="round"
        transform="translate(98,200) scale(1,0.5) rotate(45)">
    <animate attributeName="x" values="-63.65;-95.47;-63.65;-63.65" keyTimes="0;0.2;0.4;1"
      dur="2.5s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="y" values="-63.65;-95.47;-63.65;-63.65" keyTimes="0;0.2;0.4;1"
      dur="2.5s" begin="0s" repeatCount="indefinite"/>
  </rect>

  <!-- ROSSO (in alto) -->
  <rect x="-63.65" y="-63.65" width="127.3" height="127.3"
        fill="url(#gradRed)" stroke="#E64545" stroke-width="1.5" stroke-linejoin="round"
        transform="translate(200,143) scale(1,0.5) rotate(45)">
    <animate attributeName="x" values="-63.65;-63.65;-95.47;-63.65;-63.65" keyTimes="0;0.2;0.4;0.6;1"
      dur="2.5s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="y" values="-63.65;-63.65;-95.47;-63.65;-63.65" keyTimes="0;0.2;0.4;0.6;1"
      dur="2.5s" begin="0s" repeatCount="indefinite"/>
  </rect>

  <!-- ARANCIO (a destra) -->
  <rect x="-63.65" y="-63.65" width="127.3" height="127.3"
        fill="url(#gradYellow)" stroke="#F2830D" stroke-width="1.5" stroke-linejoin="round"
        transform="translate(302,200) scale(1,0.5) rotate(45)">
    <animate attributeName="x" values="-63.65;-63.65;-95.47;-63.65;-63.65" keyTimes="0;0.4;0.6;0.8;1"
      dur="2.5s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="y" values="-63.65;-63.65;-95.47;-63.65;-63.65" keyTimes="0;0.4;0.6;0.8;1"
      dur="2.5s" begin="0s" repeatCount="indefinite"/>
  </rect>

  <!-- VIOLA (in basso) - disegnato per ultimo: z-index piu' alto -->
  <rect x="-63.65" y="-63.65" width="127.3" height="127.3"
        fill="url(#gradPurple)" stroke="#A736C9" stroke-width="1.5" stroke-linejoin="round"
        transform="translate(200,257) scale(1,0.5) rotate(45)">
    <animate attributeName="x" values="-63.65;-63.65;-95.47;-63.65" keyTimes="0;0.6;0.8;1"
      dur="2.5s" begin="0s" repeatCount="indefinite"/>
    <animate attributeName="y" values="-63.65;-63.65;-95.47;-63.65" keyTimes="0;0.6;0.8;1"
      dur="2.5s" begin="0s" repeatCount="indefinite"/>
  </rect>
</svg>